openapi: 3.0.3
info:
  title: Owner API
  description: |
    Retrieve cached per-wallet positions and balances across Raydium liquidity pools.
    Designed for wallets and portfolio dashboards to fetch owner-scoped data in a single request.
  version: 1.0.0
  contact:
    name: Raydium
    url: https://raydium.io
servers:
  - url: https://owner-v1.raydium.io
    description: Mainnet
  - url: https://owner-v1-devnet.raydium.io
    description: Devnet
tags:
  - name: Position
    description: Retrieve position balances and state per wallet
  - name: Pool Creation
    description: Retrieve pools created by a wallet
  - name: IDO
    description: Retrieve IDO participation data
  - name: Admin
    description: Administrative endpoints (internal use)
paths:
  /position/stake/{owner}:
    get:
      summary: Get stake positions for a wallet
      description: |
        Retrieve cached farm stake positions owned by this wallet.
        The data payload is keyed by LP mint, farm ID, and user ledger address.
        Each entry contains programId, lpAmount, and version. Pending reward amounts
        and reward mints are not included.
        To calculate pending rewards, use raydium.farm.fetchFarmBalances() with
        Solana RPC access. See the wallet integration guide for an example.
      operationId: getOwnerStakePositions
      tags:
        - Position
      parameters:
        - name: owner
          in: path
          required: true
          description: Wallet public key (base58)
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FarmPositionsResponse'
        '404':
          description: Wallet has no stake positions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /position/clmm-lock/{owner}:
    get:
      summary: Get locked CLMM positions for a wallet
      description: |
        Retrieve all locked Concentrated Liquidity Market Maker positions owned by this wallet.
        Returns position state including locked amounts, lock end time, and claimable fees.
      operationId: getOwnerClmmLockPositions
      tags:
        - Position
      parameters:
        - name: owner
          in: path
          required: true
          description: Wallet public key (base58)
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                description: Locked position data structure
        '404':
          description: Wallet has no locked CLMM positions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /create-pool/{owner}:
    get:
      summary: Get pools created by a wallet
      description: |
        Retrieve all CPMM pools created (launched) by this wallet.
      operationId: getOwnerCreatedPools
      tags:
        - Pool Creation
      parameters:
        - name: owner
          in: path
          required: true
          description: Wallet public key (base58)
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                description: Created pools data
        '404':
          description: Wallet has not created any pools
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /main/ido/{owner}:
    get:
      summary: Get IDO participation info for a wallet
      description: |
        Retrieve IDO participation data, including invested amounts and claim status.
      operationId: getOwnerIdoInfo
      tags:
        - IDO
      parameters:
        - name: owner
          in: path
          required: true
          description: Wallet public key (base58)
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                description: IDO participation data
        '404':
          description: Wallet has no IDO participation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    FarmPositionsResponse:
      type: object
      description: Successful response envelope. The SDK returns its data payload.
      properties:
        data:
          $ref: '#/components/schemas/FarmPositionData'
      required:
        - data
    FarmPositionData:
      type: object
      description: FarmPositionData in SDK v2 0.2.64-alpha, keyed by LP mint address.
      additionalProperties:
        type: object
        description: Farm positions keyed by farm ID.
        additionalProperties:
          type: object
          description: User positions keyed by user ledger address.
          additionalProperties:
            $ref: '#/components/schemas/FarmStakePosition'
    FarmStakePosition:
      type: object
      description: Cached stake position. Does not contain pending reward amounts or reward mints.
      properties:
        programId:
          type: string
          description: Farm program public key in base58.
        lpAmount:
          type: string
          description: Cached staked amount as a string.
        version:
          type: string
          enum: [V1, V2]
          description: User ledger version, not the farm program generation.
      required:
        - programId
        - lpAmount
        - version
    ErrorResponse:
      type: object
      description: Standard error response
      properties:
        id:
          type: string
          description: Request ID (UUID)
        success:
          type: boolean
          example: false
      required:
        - id
        - success
