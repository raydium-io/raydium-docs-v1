openapi: 3.0.3
info:
  title: "API Chủ Sở Hữu"
  description: |
    Tra cứu vị thế và số dư được lưu trong bộ nhớ đệm theo ví.
    Tiện ích cho các ví và bảng điều khiển danh mục đầu tư để lấy dữ liệu theo phạm vi chủ sở hữu trong một yêu cầu duy nhất.
  version: 1.0.0
  contact:
    name: Raydium
    url: https://raydium.io
servers:
  - url: https://owner-v1.raydium.io
    description: Mainnet
  - url: https://owner-v1-devnet.raydium.io
    description: Devnet
tags:
  - name: Position
    description: "Lấy số dư vị trí và trạng thái cho mỗi ví"
  - name: Pool Creation
    description: "Lấy các pool do ví tạo"
  - name: IDO
    description: "Lấy dữ liệu tham gia IDO"
  - name: Admin
    description: "Các endpoint hành chính (sử dụng nội bộ)"
paths:
  /position/stake/{owner}:
    get:
      summary: "Lấy vị trí stake của một ví"
      description: |
        Endpoint vị thế staking không trả về số lượng phần thưởng chưa nhận hoặc mint của token phần thưởng. Dùng raydium.farm.fetchFarmBalances() để đọc các tài khoản on-chain qua Solana RPC và tính phần thưởng.
        SDK v2 0.2.64-alpha: data[lpMint][farmId][userVault] = { programId, lpAmount, version }.
      operationId: getOwnerStakePositions
      tags:
        - Position
      parameters:
        - name: owner
          in: path
          required: true
          description: "Khóa công khai ví (base58)"
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FarmPositionsResponse'
        '404':
          description: "Ví không có vị trí stake"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /position/clmm-lock/{owner}:
    get:
      summary: "Lấy vị trí CLMM bị khóa của một ví"
      description: |
        Lấy tất cả vị trí Concentrated Liquidity Market Maker (CLMM) bị khóa được sở hữu bởi ví này.
        Trả về trạng thái vị trí bao gồm số lượng bị khóa, thời gian kết thúc khóa, và phí có thể nhận được.
      operationId: getOwnerClmmLockPositions
      tags:
        - Position
      parameters:
        - name: owner
          in: path
          required: true
          description: "Khóa công khai ví (base58)"
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                description: "Cấu trúc dữ liệu vị trí bị khóa"
        '404':
          description: "Ví không có vị trí CLMM bị khóa"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /create-pool/{owner}:
    get:
      summary: "Lấy các pool do ví tạo"
      description: |
        Lấy tất cả pool CPMM được tạo (khởi chạy) bởi ví này.
      operationId: getOwnerCreatedPools
      tags:
        - Pool Creation
      parameters:
        - name: owner
          in: path
          required: true
          description: "Khóa công khai ví (base58)"
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                description: "Dữ liệu các pool được tạo"
        '404':
          description: "Ví chưa tạo pool nào"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /main/ido/{owner}:
    get:
      summary: "Lấy thông tin tham gia IDO của một ví"
      description: |
        Lấy dữ liệu tham gia IDO bao gồm số lượng đã đầu tư và trạng thái yêu cầu.
      operationId: getOwnerIdoInfo
      tags:
        - IDO
      parameters:
        - name: owner
          in: path
          required: true
          description: "Khóa công khai ví (base58)"
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                description: "Dữ liệu tham gia IDO"
        '404':
          description: "Ví không có tham gia IDO"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    FarmPositionsResponse:
      type: object
      description: Successful response envelope. The SDK returns its data payload.
      properties:
        data:
          $ref: '#/components/schemas/FarmPositionData'
      required:
        - data
    FarmPositionData:
      type: object
      description: FarmPositionData in SDK v2 0.2.64-alpha, keyed by LP mint address.
      additionalProperties:
        type: object
        description: Farm positions keyed by farm ID.
        additionalProperties:
          type: object
          description: User positions keyed by user ledger address.
          additionalProperties:
            $ref: '#/components/schemas/FarmStakePosition'
    FarmStakePosition:
      type: object
      description: Cached stake position. Does not contain pending reward amounts or reward mints.
      properties:
        programId:
          type: string
          description: Farm program public key in base58.
        lpAmount:
          type: string
          description: Cached staked amount as a string.
        version:
          type: string
          enum: [V1, V2]
          description: User ledger version, not the farm program generation.
      required:
        - programId
        - lpAmount
        - version
    ErrorResponse:
      type: object
      description: "Phản hồi lỗi tiêu chuẩn"
      properties:
        id:
          type: string
          description: "ID yêu cầu (UUID)"
        success:
          type: boolean
          example: false
      required:
        - id
        - success
