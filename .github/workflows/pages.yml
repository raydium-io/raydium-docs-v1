name: Deploy static assets to GitHub Pages

# Publishes the contents of public/ to GitHub Pages.
# The docs site itself is built by Mintlify; this workflow only serves
# static files (e.g. the MiCAR white paper .xhtml / .pdf) that Mintlify
# cannot host directly, so browsers render them with the correct
# Content-Type instead of showing source.
#
# One-time setup required in the repo: Settings -> Pages -> Build and
# deployment -> Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer runs supersede in-progress ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload public/ as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
