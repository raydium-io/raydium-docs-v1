openapi: 3.0.3
info:
  title: "Owner API"
  description: |
    取得每個錢包的快取倉位和餘額.
    專為錢包和投資組合儀表板設計，可在單次請求中取得錢包範圍內的資料。
  version: 1.0.0
  contact:
    name: Raydium
    url: https://raydium.io
servers:
  - url: https://owner-v1.raydium.io
    description: Mainnet
  - url: https://owner-v1-devnet.raydium.io
    description: Devnet
tags:
  - name: Position
    description: "檢索每個錢包的持倉餘額和狀態"
  - name: Pool Creation
    description: "檢索錢包建立的池"
  - name: IDO
    description: "檢索 IDO 參與資料"
  - name: Admin
    description: "管理端點（內部使用）"
paths:
  /position/stake/{owner}:
    get:
      summary: "取得錢包的質押持倉"
      description: |
        質押倉位端點不傳回待領取獎勵金額或獎勵代幣的 mint。使用 raydium.farm.fetchFarmBalances() 透過 Solana RPC 讀取鏈上帳戶並計算獎勵。
        SDK v2 0.2.64-alpha: data[lpMint][farmId][userVault] = { programId, lpAmount, version }.
      operationId: getOwnerStakePositions
      tags:
        - Position
      parameters:
        - name: owner
          in: path
          required: true
          description: "錢包公鑰（base58）"
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FarmPositionsResponse'
        '404':
          description: "錢包沒有質押持倉"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /position/clmm-lock/{owner}:
    get:
      summary: "取得錢包的已鎖定 CLMM 持倉"
      description: |
        檢索此錢包擁有的所有已鎖定集中流動性做市商持倉。
        傳回持倉狀態，包括已鎖定金額、鎖定結束時間和可領取費用。
      operationId: getOwnerClmmLockPositions
      tags:
        - Position
      parameters:
        - name: owner
          in: path
          required: true
          description: "錢包公鑰（base58）"
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                description: "已鎖定持倉資料結構"
        '404':
          description: "錢包沒有已鎖定 CLMM 持倉"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /create-pool/{owner}:
    get:
      summary: "取得錢包建立的池"
      description: |
        檢索此錢包建立（啟動）的所有 CPMM 池。
      operationId: getOwnerCreatedPools
      tags:
        - Pool Creation
      parameters:
        - name: owner
          in: path
          required: true
          description: "錢包公鑰（base58）"
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                description: "已建立池資料"
        '404':
          description: "錢包未建立任何池"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /main/ido/{owner}:
    get:
      summary: "取得錢包的 IDO 參與資訊"
      description: |
        檢索 IDO 參與資料，包括投資金額和領取狀態。
      operationId: getOwnerIdoInfo
      tags:
        - IDO
      parameters:
        - name: owner
          in: path
          required: true
          description: "錢包公鑰（base58）"
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                description: "IDO 參與資料"
        '404':
          description: "錢包沒有 IDO 參與"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    FarmPositionsResponse:
      type: object
      description: Successful response envelope. The SDK returns its data payload.
      properties:
        data:
          $ref: '#/components/schemas/FarmPositionData'
      required:
        - data
    FarmPositionData:
      type: object
      description: FarmPositionData in SDK v2 0.2.64-alpha, keyed by LP mint address.
      additionalProperties:
        type: object
        description: Farm positions keyed by farm ID.
        additionalProperties:
          type: object
          description: User positions keyed by user ledger address.
          additionalProperties:
            $ref: '#/components/schemas/FarmStakePosition'
    FarmStakePosition:
      type: object
      description: Cached stake position. Does not contain pending reward amounts or reward mints.
      properties:
        programId:
          type: string
          description: Farm program public key in base58.
        lpAmount:
          type: string
          description: Cached staked amount as a string.
        version:
          type: string
          enum: [V1, V2]
          description: User ledger version, not the farm program generation.
      required:
        - programId
        - lpAmount
        - version
    ErrorResponse:
      type: object
      description: "標準錯誤回應"
      properties:
        id:
          type: string
          description: "請求 ID（UUID）"
        success:
          type: boolean
          example: false
      required:
        - id
        - success
