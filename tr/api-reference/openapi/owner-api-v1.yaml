openapi: 3.0.3
info:
  title: "Owner API"
  description: |
    Cüzdan başına önbelleğe alınmış pozisyonları ve bakiyeleri sorgulama.
    Cüzdan ve portföy panoları için tek bir istekte sahibi kapsamında verileri getirmek üzere tasarlanmıştır.
  version: 1.0.0
  contact:
    name: Raydium
    url: https://raydium.io
servers:
  - url: https://owner-v1.raydium.io
    description: Mainnet
  - url: https://owner-v1-devnet.raydium.io
    description: Devnet
tags:
  - name: Position
    description: "Cüzdan başına pozisyon bakiyesi ve durumunu alın"
  - name: Pool Creation
    description: "Cüzdan tarafından oluşturulan havuzları alın"
  - name: IDO
    description: "IDO katılım verilerini alın"
  - name: Admin
    description: "İdari uç noktalar (dahili kullanım)"
paths:
  /position/stake/{owner}:
    get:
      summary: "Cüzdan için stake pozisyonlarını alın"
      description: |
        Stake pozisyonları uç noktası bekleyen ödül miktarlarını veya ödül tokenlarının mint adreslerini döndürmez. Solana RPC üzerinden zincir üstü hesapları okuyup ödülleri hesaplamak için raydium.farm.fetchFarmBalances() kullanın.
        SDK v2 0.2.64-alpha: data[lpMint][farmId][userVault] = { programId, lpAmount, version }.
      operationId: getOwnerStakePositions
      tags:
        - Position
      parameters:
        - name: owner
          in: path
          required: true
          description: "Cüzdan açık anahtarı (base58)"
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FarmPositionsResponse'
        '404':
          description: "Cüzdanda stake pozisyonu yok"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /position/clmm-lock/{owner}:
    get:
      summary: "Cüzdan için kilitli CLMM pozisyonlarını alın"
      description: |
        Bu cüzdana ait tüm kilitli Concentrated Liquidity Market Maker pozisyonlarını alın.
        Kilitli tutarlar, kilit bitiş saati ve talep edilebilir ücretler dahil olmak üzere pozisyon durumunu döndürür.
      operationId: getOwnerClmmLockPositions
      tags:
        - Position
      parameters:
        - name: owner
          in: path
          required: true
          description: "Cüzdan açık anahtarı (base58)"
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                description: "Kilitli pozisyon veri yapısı"
        '404':
          description: "Cüzdanda kilitli CLMM pozisyonu yok"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /create-pool/{owner}:
    get:
      summary: "Cüzdan tarafından oluşturulan havuzları alın"
      description: |
        Bu cüzdan tarafından oluşturulan (başlatılan) tüm CPMM havuzlarını alın.
      operationId: getOwnerCreatedPools
      tags:
        - Pool Creation
      parameters:
        - name: owner
          in: path
          required: true
          description: "Cüzdan açık anahtarı (base58)"
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                description: "Oluşturulan havuzlar verisi"
        '404':
          description: "Cüzdan herhangi bir havuz oluşturmamış"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /main/ido/{owner}:
    get:
      summary: "Cüzdan için IDO katılım bilgilerini alın"
      description: |
        Yatırılan tutarlar ve talep durumu dahil olmak üzere IDO katılım verilerini alın.
      operationId: getOwnerIdoInfo
      tags:
        - IDO
      parameters:
        - name: owner
          in: path
          required: true
          description: "Cüzdan açık anahtarı (base58)"
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                description: "IDO katılım verisi"
        '404':
          description: "Cüzdanda IDO katılımı yok"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    FarmPositionsResponse:
      type: object
      description: Successful response envelope. The SDK returns its data payload.
      properties:
        data:
          $ref: '#/components/schemas/FarmPositionData'
      required:
        - data
    FarmPositionData:
      type: object
      description: FarmPositionData in SDK v2 0.2.64-alpha, keyed by LP mint address.
      additionalProperties:
        type: object
        description: Farm positions keyed by farm ID.
        additionalProperties:
          type: object
          description: User positions keyed by user ledger address.
          additionalProperties:
            $ref: '#/components/schemas/FarmStakePosition'
    FarmStakePosition:
      type: object
      description: Cached stake position. Does not contain pending reward amounts or reward mints.
      properties:
        programId:
          type: string
          description: Farm program public key in base58.
        lpAmount:
          type: string
          description: Cached staked amount as a string.
        version:
          type: string
          enum: [V1, V2]
          description: User ledger version, not the farm program generation.
      required:
        - programId
        - lpAmount
        - version
    ErrorResponse:
      type: object
      description: "Standart hata yanıtı"
      properties:
        id:
          type: string
          description: "İstek Kimliği (UUID)"
        success:
          type: boolean
          example: false
      required:
        - id
        - success
