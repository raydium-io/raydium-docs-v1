openapi: 3.0.3
info:
  title: "Owner API"
  description: |
    获取每个钱包的缓存仓位和余额.
    为钱包和投资组合仪表板设计，可在单个请求中获取钱包范围的数据。
  version: 1.0.0
  contact:
    name: Raydium
    url: https://raydium.io
servers:
  - url: https://owner-v1.raydium.io
    description: Mainnet
  - url: https://owner-v1-devnet.raydium.io
    description: Devnet
tags:
  - name: Position
    description: "检索单钱包的头寸余额和状态"
  - name: Pool Creation
    description: "检索钱包创建的池"
  - name: IDO
    description: "检索 IDO 参与数据"
  - name: Admin
    description: "管理端点（内部使用）"
paths:
  /position/stake/{owner}:
    get:
      summary: "获取钱包的质押头寸"
      description: |
        质押仓位接口不返回待领取奖励金额或奖励代币的 mint。使用 raydium.farm.fetchFarmBalances() 通过 Solana RPC 读取链上账户并计算奖励。
        SDK v2 0.2.64-alpha: data[lpMint][farmId][userVault] = { programId, lpAmount, version }.
      operationId: getOwnerStakePositions
      tags:
        - Position
      parameters:
        - name: owner
          in: path
          required: true
          description: "钱包公钥（base58）"
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FarmPositionsResponse'
        '404':
          description: "钱包没有质押头寸"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /position/clmm-lock/{owner}:
    get:
      summary: "获取钱包的锁定 CLMM 头寸"
      description: |
        检索该钱包拥有的所有锁定 Concentrated Liquidity Market Maker 头寸。
        返回头寸状态，包括锁定金额、锁定结束时间和可领取费用。
      operationId: getOwnerClmmLockPositions
      tags:
        - Position
      parameters:
        - name: owner
          in: path
          required: true
          description: "钱包公钥（base58）"
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                description: "锁定头寸数据结构"
        '404':
          description: "钱包没有锁定 CLMM 头寸"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /create-pool/{owner}:
    get:
      summary: "获取钱包创建的池"
      description: |
        检索该钱包创建（启动）的所有 CPMM 池。
      operationId: getOwnerCreatedPools
      tags:
        - Pool Creation
      parameters:
        - name: owner
          in: path
          required: true
          description: "钱包公钥（base58）"
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                description: "已创建的池数据"
        '404':
          description: "钱包尚未创建任何池"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /main/ido/{owner}:
    get:
      summary: "获取钱包的 IDO 参与信息"
      description: |
        检索 IDO 参与数据，包括投入金额和领取状态。
      operationId: getOwnerIdoInfo
      tags:
        - IDO
      parameters:
        - name: owner
          in: path
          required: true
          description: "钱包公钥（base58）"
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                description: "IDO 参与数据"
        '404':
          description: "钱包没有 IDO 参与"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    FarmPositionsResponse:
      type: object
      description: Successful response envelope. The SDK returns its data payload.
      properties:
        data:
          $ref: '#/components/schemas/FarmPositionData'
      required:
        - data
    FarmPositionData:
      type: object
      description: FarmPositionData in SDK v2 0.2.64-alpha, keyed by LP mint address.
      additionalProperties:
        type: object
        description: Farm positions keyed by farm ID.
        additionalProperties:
          type: object
          description: User positions keyed by user ledger address.
          additionalProperties:
            $ref: '#/components/schemas/FarmStakePosition'
    FarmStakePosition:
      type: object
      description: Cached stake position. Does not contain pending reward amounts or reward mints.
      properties:
        programId:
          type: string
          description: Farm program public key in base58.
        lpAmount:
          type: string
          description: Cached staked amount as a string.
        version:
          type: string
          enum: [V1, V2]
          description: User ledger version, not the farm program generation.
      required:
        - programId
        - lpAmount
        - version
    ErrorResponse:
      type: object
      description: "标准错误响应"
      properties:
        id:
          type: string
          description: "请求 ID（UUID）"
        success:
          type: boolean
          example: false
      required:
        - id
        - success
