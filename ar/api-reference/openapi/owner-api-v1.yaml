openapi: 3.0.3
info:
  title: "واجهة مالك المحفظة"
  description: |
    استرجاع المراكز والأرصدة المخزنة مؤقتًا لكل محفظة.
    مصمّمة للمحافظ ولوحات معلومات المحفظات لجلب البيانات المحدودة بنطاق المالك في طلب واحد.
  version: 1.0.0
  contact:
    name: Raydium
    url: https://raydium.io
servers:
  - url: https://owner-v1.raydium.io
    description: Mainnet
  - url: https://owner-v1-devnet.raydium.io
    description: Devnet
tags:
  - name: Position
    description: "استرجاع أرصدة المراكز والحالة لكل محفظة"
  - name: Pool Creation
    description: "استرجاع المجمعات التي أنشأتها محفظة"
  - name: IDO
    description: "استرجاع بيانات المشاركة في IDO"
  - name: Admin
    description: "نقاط نهاية إدارية (الاستخدام الداخلي)"
paths:
  /position/stake/{owner}:
    get:
      summary: "الحصول على مراكز الـ Stake لمحفظة"
      description: |
        لا تُرجع نقطة نهاية مراكز التخزين مبالغ المكافآت المعلّقة أو عناوين mint لرموز المكافآت. استخدم raydium.farm.fetchFarmBalances() لقراءة الحسابات على السلسلة عبر Solana RPC وحساب المكافآت.
        SDK v2 0.2.64-alpha: data[lpMint][farmId][userVault] = { programId, lpAmount, version }.
      operationId: getOwnerStakePositions
      tags:
        - Position
      parameters:
        - name: owner
          in: path
          required: true
          description: "مفتاح المحفظة العمومي (base58)"
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FarmPositionsResponse'
        '404':
          description: "المحفظة ليس لديها مراكز stake"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /position/clmm-lock/{owner}:
    get:
      summary: "الحصول على مراكز CLMM المقفلة لمحفظة"
      description: |
        استرجاع جميع مراكز Concentrated Liquidity Market Maker المقفلة المملوكة لهذه المحفظة.
        يرجع حالة المركز بما في ذلك الكميات المقفلة ووقت انتهاء القفل والرسوم القابلة للمطالبة.
      operationId: getOwnerClmmLockPositions
      tags:
        - Position
      parameters:
        - name: owner
          in: path
          required: true
          description: "مفتاح المحفظة العمومي (base58)"
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                description: "هيكل بيانات المركز المقفل"
        '404':
          description: "المحفظة ليس لديها مراكز CLMM مقفلة"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /create-pool/{owner}:
    get:
      summary: "الحصول على المجمعات التي أنشأتها محفظة"
      description: |
        استرجاع جميع مجمعات CPMM التي أنشأتها (أطلقتها) هذه المحفظة.
      operationId: getOwnerCreatedPools
      tags:
        - Pool Creation
      parameters:
        - name: owner
          in: path
          required: true
          description: "مفتاح المحفظة العمومي (base58)"
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                description: "بيانات المجمعات المنشأة"
        '404':
          description: "المحفظة لم تنشئ أي مجمعات"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /main/ido/{owner}:
    get:
      summary: "الحصول على معلومات المشاركة في IDO لمحفظة"
      description: |
        استرجاع بيانات المشاركة في IDO، بما في ذلك الكميات المستثمرة وحالة المطالبة.
      operationId: getOwnerIdoInfo
      tags:
        - IDO
      parameters:
        - name: owner
          in: path
          required: true
          description: "مفتاح المحفظة العمومي (base58)"
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                description: "بيانات المشاركة في IDO"
        '404':
          description: "المحفظة ليس لديها مشاركة في IDO"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    FarmPositionsResponse:
      type: object
      description: Successful response envelope. The SDK returns its data payload.
      properties:
        data:
          $ref: '#/components/schemas/FarmPositionData'
      required:
        - data
    FarmPositionData:
      type: object
      description: FarmPositionData in SDK v2 0.2.64-alpha, keyed by LP mint address.
      additionalProperties:
        type: object
        description: Farm positions keyed by farm ID.
        additionalProperties:
          type: object
          description: User positions keyed by user ledger address.
          additionalProperties:
            $ref: '#/components/schemas/FarmStakePosition'
    FarmStakePosition:
      type: object
      description: Cached stake position. Does not contain pending reward amounts or reward mints.
      properties:
        programId:
          type: string
          description: Farm program public key in base58.
        lpAmount:
          type: string
          description: Cached staked amount as a string.
        version:
          type: string
          enum: [V1, V2]
          description: User ledger version, not the farm program generation.
      required:
        - programId
        - lpAmount
        - version
    ErrorResponse:
      type: object
      description: "استجابة الخطأ القياسية"
      properties:
        id:
          type: string
          description: "معرّف الطلب (UUID)"
        success:
          type: boolean
          example: false
      required:
        - id
        - success
